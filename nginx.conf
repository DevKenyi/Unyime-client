server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing — any path not matching a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself stays revalidated on every load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
